<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Cartcut</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: transparent;
        /* The window is frameless and always-on-top; nothing here should be
           draggable or selectable, it is only shown for a few seconds. */
        -webkit-user-select: none;
        user-select: none;
      }

      img {
        display: block;
        width: 100%;
        height: 100%;
        object-fit: cover;
        border-radius: 12px;
        -webkit-user-drag: none;
      }
    </style>
  </head>
  <body>
    <!-- Kept under `apps/app/`, not the top-level `assets/`. That directory is
         an `extraResources` entry, and electron-builder excludes an
         extraResources source from the app package itself — so in a packaged
         build it exists only at `Contents/Resources/assets`, which no path
         relative to this file inside the asar can reach. `apps/` is in the
         asar, so this one resolves in dev and in a packaged build alike. -->
    <img src="../assets/images/splash.png" alt="" />
  </body>
</html>
